name: Generate Contribution Arcade

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ==========================================
      # PAC-MAN + GALAGA + BREAKOUT
      # ==========================================
      - name: Generate arcade contribution games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,galaga,breakout"
          hide_month_labels: "false"

      # ==========================================
      # YELLOW CONTRIBUTION SNAKE
      # ==========================================
      - name: Generate yellow contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake.svg?color_snake=#FFD600&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD600

      # ==========================================
      # PUBLISH KE BRANCH OUTPUT
      # ==========================================
      - name: Publish arcade assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
